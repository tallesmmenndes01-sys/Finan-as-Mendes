<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Cartão</title>
<meta name="theme-color" content="#12355B">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meu Cartão">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--azul:#12355B;--verde:#14703A;--amar:#F5A300;--verm:#C62828;--lar:#B03A0A;--texto:#0F1C2E;--suave:#3F4D5F;--fundo:#EAF0F6;--borda:#9FB0C3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{font-size:20px}
body{margin:0;background:var(--fundo);color:var(--texto);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.35;padding-bottom:calc(110px + env(safe-area-inset-bottom))}
header{background:var(--azul);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 14px}
header h1{margin:0;font-size:1.5rem}
header p{margin:2px 0 0;font-size:1rem;opacity:.9}
main{max-width:640px;margin:0 auto;padding:16px}
h2{font-size:1.5rem;margin:4px 0 14px}
h3{font-size:1.2rem;margin:0 0 8px}
.card{background:#fff;border:2px solid var(--borda);border-radius:20px;padding:18px;margin-bottom:16px}
.hero{text-align:center;border-width:3px}
.hero .rot{font-size:1.1rem;color:var(--suave);font-weight:600}
.hero .num{font-size:2.6rem;font-weight:800;line-height:1.15;margin:2px 0 12px}
.barra{height:36px;background:#D5DDE6;border-radius:18px;overflow:hidden;border:2px solid var(--borda)}
.barra i{display:block;height:100%;border-radius:18px 0 0 18px;transition:width .5s}
.verde i{background:var(--verde)}.amar i{background:var(--amar)}.verm i{background:var(--verm)}
.pct{margin:10px 0 12px;font-size:1.05rem;font-weight:600}
.status{border-radius:14px;padding:12px;font-weight:800;font-size:1.15rem}
.verde .status{background:#DDF3E4;color:#0A4A24}
.amar .status{background:#FFEDBF;color:#5A3A00}
.verm .status{background:#FBDADA;color:#7A0C0C}
.fecha{margin:12px 0 0;color:var(--suave);font-size:1rem}
.item{display:flex;gap:12px;align-items:center;padding:14px 0;border-top:2px solid #DDE4EC}
.item:first-of-type{border-top:0}
.info{flex:1;min-width:0}
.info b{display:block;font-size:1.15rem;overflow-wrap:anywhere}
.info small{color:var(--suave);font-size:.9rem}
.dir{text-align:right}
.val{font-weight:800;font-size:1.2rem;white-space:nowrap}
.apagar{margin-top:6px;min-height:46px;padding:0 14px;border:2px solid var(--verm);color:var(--verm);background:#fff;border-radius:12px;font-size:.95rem;font-weight:700}
.vazio{text-align:center;color:var(--suave);padding:14px 0}
label{display:block;font-weight:700;font-size:1.1rem;margin:16px 0 6px}
label:first-child{margin-top:0}
input,select{width:100%;min-height:62px;font-size:1.3rem;padding:0 14px;border:3px solid #5E7189;border-radius:14px;background:#fff;color:var(--texto);font-family:inherit}
input:focus,select:focus,button:focus-visible{outline:4px solid #1F6FD1;outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.chip{min-height:48px;padding:0 16px;border:2px solid var(--azul);background:#fff;color:var(--azul);border-radius:999px;font-size:1rem;font-weight:700}
.previa{min-height:1.4em;margin:12px 0 0;font-weight:700;color:var(--azul)}
.erro{color:var(--verm);font-weight:800;margin:10px 0 0;min-height:1.2em}
.btn{display:block;width:100%;min-height:70px;border:0;border-radius:16px;font-size:1.3rem;font-weight:800;color:#fff;margin-top:16px;font-family:inherit}
.btn:active{transform:scale(.98)}
.b-verde{background:var(--verde)}.b-verm{background:var(--verm)}.b-lar{background:var(--lar)}.b-cinza{background:#DCE3EB;color:var(--texto)}
.h{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-top:2px solid #DDE4EC;font-size:1.05rem}
.h:first-child{border-top:0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:3px solid var(--borda);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;height:82px;border:0;border-top:6px solid transparent;background:#fff;color:var(--suave);font-family:inherit;font-size:1rem;font-weight:700}
nav button span{display:block;font-size:1.9rem;line-height:1.2}
nav button.on{color:var(--verde);border-top-color:var(--verde);background:#E6F4EA}
#modal{position:fixed;inset:0;background:rgba(10,20,35,.7);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.box{background:#fff;border-radius:22px;padding:22px;width:100%;max-width:440px}
.box p{font-size:1.3rem;margin:0 0 6px}
#toast{position:fixed;left:16px;right:16px;bottom:calc(110px + env(safe-area-inset-bottom));background:#0F1C2E;color:#fff;padding:16px;border-radius:14px;font-size:1.1rem;font-weight:700;text-align:center;opacity:0;pointer-events:none;transition:opacity .3s;z-index:30}
#toast.on{opacity:1}
</style>
</head>
<body>
<header><h1>💳 Meu Cartão</h1><p id="mes"></p></header>
<main>
  <section id="tab-inicio"></section>

  <section id="tab-lancar" hidden>
    <h2>➕ Lançar uma compra</h2>
    <div class="card">
      <label for="nome">Onde você gastou?</label>
      <input id="nome" type="text" placeholder="Ex.: Padaria" autocomplete="off" maxlength="40">
      <div class="chips" id="chips"></div>
      <label for="valor">Quanto custou? (R$)</label>
      <input id="valor" type="text" inputmode="decimal" placeholder="Ex.: 25,90" autocomplete="off">
      <label for="parc">Parcelas (se não parcelou, deixe 1x)</label>
      <select id="parc"></select>
      <p class="previa" id="previa" aria-live="polite"></p>
      <p class="erro" id="erro" role="alert"></p>
      <button class="btn b-verde" id="salvar">SALVAR COMPRA</button>
    </div>
  </section>

  <section id="tab-config" hidden>
    <h2>⚙️ Configurações</h2>
    <div class="card">
      <label for="c-lim">Limite do cartão (R$)</label>
      <input id="c-lim" type="text" inputmode="decimal" autocomplete="off">
      <label for="c-dia">Dia de fechamento da fatura</label>
      <select id="c-dia"></select>
      <p class="erro" id="c-erro" role="alert"></p>
      <button class="btn b-verde" id="c-salvar">SALVAR CONFIGURAÇÕES</button>
    </div>
    <div class="card">
      <h3>🔄 Nova fatura</h3>
      <p>Use no dia em que a fatura fechar. O total do mês fica guardado e a lista começa vazia.</p>
      <button class="btn b-lar" id="zerar">ZERAR O MÊS / NOVA FATURA</button>
    </div>
    <div class="card">
      <h3>📜 Faturas anteriores</h3>
      <div id="hist"></div>
    </div>
  </section>
</main>

<nav>
  <button data-t="inicio" id="nav-inicio"><span>🏠</span>Início</button>
  <button data-t="lancar" id="nav-lancar"><span>➕</span>Lançar</button>
  <button data-t="config" id="nav-config"><span>⚙️</span>Configurações</button>
</nav>

<div id="modal" hidden role="dialog" aria-modal="true">
  <div class="box"><p id="m-msg"></p><button class="btn" id="m-sim"></button><button class="btn b-cinza" id="m-nao">NÃO, VOLTAR</button></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const KEY = 'cartaoPai_v1';
  const $ = id => document.getElementById(id);
  const brl = new Intl.NumberFormat('pt-BR', {style: 'currency', currency: 'BRL'});
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const r2 = n => Math.round(n * 100) / 100;
  const base = () => ({limite: 1500, fechamento: 10, configurado: false, gastos: [], historico: []});

  // ---------- Dados (localStorage, com reserva em memória) ----------
  let S;
  try { S = {...base(), ...JSON.parse(localStorage.getItem(KEY) || '{}')}; } catch (e) { S = base(); }
  const salvar = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

  const gasto = () => r2(S.gastos.reduce((a, g) => a + g.valor, 0));

  function num(t) {
    t = String(t).replace(/[^\d.,]/g, '');
    if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.');
    else if (/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, '');
    const n = parseFloat(t);
    return isFinite(n) ? r2(n) : NaN;
  }

  function fmtData(iso) {
    const d = new Date(iso), h = new Date(), o = new Date();
    o.setDate(h.getDate() - 1);
    const igual = (a, b) => a.toDateString() === b.toDateString();
    return (igual(d, h) ? 'Hoje, ' : igual(d, o) ? 'Ontem, ' : '') + d.toLocaleDateString('pt-BR');
  }

  function diasParaFechar() {
    const h = new Date(); h.setHours(0, 0, 0, 0);
    const alvo = (y, m) => new Date(y, m, Math.min(S.fechamento, new Date(y, m + 1, 0).getDate()));
    let a = alvo(h.getFullYear(), h.getMonth());
    if (a < h) a = alvo(h.getFullYear(), h.getMonth() + 1);
    return Math.round((a - h) / 864e5);
  }

  // ---------- Avisos e confirmações grandes ----------
  function toast(t) {
    const e = $('toast'); e.textContent = t; e.classList.add('on');
    clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 3500);
  }

  function confirmar(msg, textoSim, cls) {
    return new Promise(res => {
      $('m-msg').innerHTML = msg;
      $('m-sim').textContent = textoSim;
      $('m-sim').className = 'btn ' + (cls || 'b-verm');
      $('modal').hidden = false;
      const fim = v => { $('modal').hidden = true; res(v); };
      $('m-sim').onclick = () => fim(true);
      $('m-nao').onclick = () => fim(false);
    });
  }

  // ---------- Navegação ----------
  function irPara(t) {
    ['inicio', 'lancar', 'config'].forEach(n => {
      $('tab-' + n).hidden = n !== t;
      $('nav-' + n).classList.toggle('on', n === t);
    });
    if (t === 'inicio') renderInicio();
    if (t === 'config') renderConfig();
    if (t === 'lancar') previa();
    window.scrollTo(0, 0);
  }

  // ---------- Tela Início ----------
  function renderInicio() {
    const lim = S.limite, g = gasto(), disp = r2(lim - g), pct = lim > 0 ? g / lim * 100 : 100;
    const cor = pct > 80 ? 'verm' : pct > 50 ? 'amar' : 'verde';
    const msg = cor === 'verde' ? '✅ Tudo certo! Gastos sob controle.'
      : cor === 'amar' ? '⚠️ Atenção! Você já usou mais da metade do limite.'
      : disp < 0 ? '🛑 LIMITE ESTOURADO! Evite usar o cartão.'
      : '🚨 PERIGO! O limite está quase acabando!';
    const d = diasParaFechar();
    const fecha = d === 0 ? 'Hoje é o dia de fechar a fatura!' : d === 1 ? `A fatura fecha amanhã (dia ${S.fechamento}).` : `A fatura fecha em ${d} dias (dia ${S.fechamento}).`;
    const lista = [...S.gastos].sort((a, b) => b.id - a.id);

    $('tab-inicio').innerHTML = `
      ${S.configurado ? '' : `<div class="card"><h3>👋 Bem-vindo!</h3><p>Primeiro, informe o limite do seu cartão.</p><button class="btn b-verde" data-go="config">DEFINIR O LIMITE</button></div>`}
      <div class="card hero ${cor}">
        <div class="rot">${disp < 0 ? 'Você passou do limite em' : 'Você ainda pode gastar'}</div>
        <div class="num">${brl.format(Math.abs(disp))}</div>
        <div class="barra" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct)}"><i style="width:${Math.min(100, pct)}%"></i></div>
        <div class="pct">Usou ${Math.round(pct)}% do limite: ${brl.format(g)} de ${brl.format(lim)}</div>
        <div class="status">${msg}</div>
        <p class="fecha">${fecha}</p>
      </div>
      <div class="card">
        <h3>🛒 Compras desta fatura</h3>
        ${lista.length ? lista.map(x => `
          <div class="item">
            <div class="info"><b>${esc(x.nome)}</b><small>${fmtData(x.data)}${x.parcelas > 1 ? `, parcela ${x.atual} de ${x.parcelas} (total ${brl.format(x.total)})` : ''}</small></div>
            <div class="dir"><div class="val">${brl.format(x.valor)}</div><button class="apagar" data-del="${x.id}">🗑️ Apagar</button></div>
          </div>`).join('') : '<p class="vazio">Nenhuma compra ainda. Toque em ➕ Lançar para anotar a primeira.</p>'}
      </div>`;
  }

  $('tab-inicio').addEventListener('click', async e => {
    const go = e.target.closest('[data-go]');
    if (go) return irPara(go.dataset.go);
    const b = e.target.closest('[data-del]');
    if (!b) return;
    const g = S.gastos.find(x => x.id === +b.dataset.del);
    if (!g) return;
    if (await confirmar(`Apagar esta compra?<br><b>${esc(g.nome)}</b>, ${brl.format(g.valor)}`, 'SIM, APAGAR')) {
      S.gastos = S.gastos.filter(x => x.id !== g.id);
      salvar(); renderInicio(); toast('Compra apagada.');
    }
  });

  // ---------- Tela Lançar ----------
  ['Padaria', 'Farmácia', 'Supermercado', 'Posto', 'Restaurante'].forEach(n => {
    const c = document.createElement('button');
    c.type = 'button'; c.className = 'chip'; c.textContent = n;
    c.onclick = () => { $('nome').value = n; $('valor').focus(); };
    $('chips').appendChild(c);
  });
  for (let i = 1; i <= 12; i++) $('parc').add(new Option(i === 1 ? '1x (à vista)' : i + 'x', i));

  function previa() {
    const v = num($('valor').value), n = +$('parc').value;
    $('erro').textContent = '';
    if (!(v > 0)) { $('previa').textContent = ''; return; }
    const p = r2(v / n), sobra = r2(S.limite - gasto() - p);
    $('previa').textContent = (n > 1 ? `Parcela de ${brl.format(p)} neste mês. ` : '') +
      (sobra >= 0 ? `Depois desta compra sobram ${brl.format(sobra)}.` : `⚠️ Esta compra passa do limite em ${brl.format(-sobra)}.`);
  }
  $('valor').addEventListener('input', previa);
  $('parc').addEventListener('change', previa);

  $('salvar').addEventListener('click', async () => {
    const nome = $('nome').value.trim(), total = num($('valor').value), n = +$('parc').value;
    if (!nome) { $('erro').textContent = 'Escreva onde você gastou.'; return $('nome').focus(); }
    if (!(total > 0)) { $('erro').textContent = 'Escreva o valor. Exemplo: 25,90'; return $('valor').focus(); }
    const v = r2(total / n), sobra = r2(S.limite - gasto() - v);
    if (sobra < 0 && !(await confirmar(`⚠️ Esta compra passa do limite em <b>${brl.format(-sobra)}</b>.<br>Quer salvar mesmo assim?`, 'SIM, SALVAR', 'b-lar'))) return;
    S.gastos.push({id: Date.now(), nome, total, parcelas: n, atual: 1, valor: v, data: new Date().toISOString()});
    salvar();
    $('nome').value = ''; $('valor').value = ''; $('parc').value = 1;
    irPara('inicio'); toast('✔ Compra salva!');
  });

  // ---------- Tela Configurações ----------
  for (let i = 1; i <= 31; i++) $('c-dia').add(new Option('Dia ' + i, i));

  function renderConfig() {
    $('c-lim').value = String(S.limite).replace('.', ',');
    $('c-dia').value = S.fechamento;
    $('c-erro').textContent = '';
    $('hist').innerHTML = S.historico.length
      ? S.historico.map(h => `<div class="h"><span>Fechada em ${new Date(h.fechadoEm).toLocaleDateString('pt-BR')}<br><small>${h.qtd} compra(s)</small></span><b>${brl.format(h.total)}</b></div>`).join('')
      : '<p class="vazio">Nenhuma fatura fechada ainda.</p>';
  }

  $('c-salvar').addEventListener('click', () => {
    const l = num($('c-lim').value);
    if (!(l > 0)) { $('c-erro').textContent = 'Escreva o limite. Exemplo: 1500,00'; return $('c-lim').focus(); }
    S.limite = l; S.fechamento = +$('c-dia').value; S.configurado = true;
    salvar(); irPara('inicio'); toast('✔ Configurações salvas!');
  });

  $('zerar').addEventListener('click', async () => {
    if (!S.gastos.length) return toast('Não há compras para fechar.');
    const agora = new Date(), t = gasto();
    // Parcelas que ainda faltam entram automaticamente na próxima fatura
    const resto = S.gastos.filter(g => g.atual < g.parcelas).map((g, i) => ({...g, id: agora.getTime() + i + 1, atual: g.atual + 1, data: agora.toISOString()}));
    const aviso = resto.length ? `<br>${resto.length} parcela(s) continuam na próxima fatura.` : '';
    if (!(await confirmar(`Fechar a fatura?<br>Total do mês: <b>${brl.format(t)}</b>${aviso}`, 'SIM, ZERAR O MÊS', 'b-lar'))) return;
    S.historico.unshift({id: agora.getTime(), fechadoEm: agora.toISOString(), total: t, qtd: S.gastos.length});
    S.gastos = resto;
    salvar(); irPara('inicio'); toast('✔ Fatura fechada. Novo mês começou!');
  });

  // ---------- Início ----------
  document.querySelectorAll('nav button').forEach(b => b.onclick = () => irPara(b.dataset.t));
  const m = new Date().toLocaleDateString('pt-BR', {month: 'long', year: 'numeric'});
  $('mes').textContent = m.charAt(0).toUpperCase() + m.slice(1);
  irPara('inicio');

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
})();
</script>
</body>
</html>
